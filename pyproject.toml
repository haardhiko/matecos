[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orchadeck"
version = "0.1.0"
description = "OrchaDeck — Multi-Agent Tool Ecosystem and Dynamic Orchestration Platform"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Data validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    # Cache / Queue
    "redis[hiredis]>=5.0",
    # HTTP client
    "httpx>=0.27",
    # Templating
    "jinja2>=3.1",
    # Logging
    "structlog>=24.0",
    # Observability
    "opentelemetry-sdk>=1.24",
    "opentelemetry-api>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
    "opentelemetry-instrumentation-redis>=0.45b0",
    # Reliability
    "tenacity>=8.3",
    # JSON schema validation
    "jsonschema>=4.22",
    # YAML
    "pyyaml>=6.0",
    # Docker SDK
    "docker>=7.0",
    # ID generation
    "ulid-py>=1.1",
    # Security
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.9",
    # Text processing
    "rank-bm25>=0.2",
    # Async utilities
    "anyio>=4.4",
    "aiofiles>=24.1",
    # Semver
    "semver>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "hypothesis>=6.100",
    "testcontainers[postgres,redis]>=4.5",
    "schemathesis>=3.25",
    "httpx>=0.27",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "bandit[toml]>=1.7",
    "factory-boy>=3.3",
    "freezegun>=1.4",
    "locust>=2.28",
    "types-pyyaml>=6.0",
    "types-redis>=4.6",
    "types-jsonschema>=4.21",
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "W", "F", "I", "N", "B", "S", "UP", "ANN"]
ignore = ["ANN101", "ANN102", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p no:respx -p no:schemathesis --cov=src --cov-report=term-missing -v"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring DB and Redis",
    "security: adversarial security tests",
    "contract: contract / schema tests",
    "e2e: full pipeline end-to-end tests",
    "load: load and resilience tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.bandit]
skips = ["B101"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
